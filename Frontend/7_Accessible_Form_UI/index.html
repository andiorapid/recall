<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Form UI</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="main">
        <section class="main__sections">        
            <form action="" class="main__form">
                <div class="main__form-sections">
                    <div class="main__form-section">
                        <div class="main__form-group">
                            <label for="" class="main__form-label">Full Name</label>
                            <input type="text" name="" id="" class="main__form-input">
                        </div>
                        <div class="main__form-group">
                            <label for="" class="main__form-label">Email</label>
                            <input type="email" name="" id="" class="main__form-input">
                        </div>
                    </div>
                    <div class="main__form-section">
                        <div class="main__form-group">
                            <label for="" class="main__form-label">Enter Password</label>
                            <input type="password" name="" id="" class="main__form-input">
                        </div>
                        <div class="main__form-group">
                            <label for="" class="main__form-label">Confirm Password</label>
                            <input type="password" name="" id="" class="main__form-input">
                        </div>
                    </div>
                    <div class="main__form-section">
                        <button type="submit" class="main__form-button">Update Profile</button>
                    </div>
                </div>
            </form>
            <div class="main__profile-completeness">
                <p class="main__profile-completeness-text">Profile Completeness</p>
                <ul class="main__profile-completeness-list">
                    <li class="profile-completeness-list-element"></li>
                    <li class="profile-completeness-list-element"></li>
                    <li class="profile-completeness-list-element"></li>
                    <li class="profile-completeness-list-element"></li>
                    <li class="profile-completeness-list-element"></li>
                </ul>
            </div>
            
        </section>
    </main>
</body>
</html>
