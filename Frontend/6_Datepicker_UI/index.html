    <title>Datepicker UI</title>
    <link rel="stylesheet" href="./style.css">

<body>
    <main class="main">

            <div class="datapicker__controls">

                        </div>

                        </div>
                        <div class="calendar__weekday">

                        </div>
                    </div>
            </div>
        </div>
    </main>

</html>
