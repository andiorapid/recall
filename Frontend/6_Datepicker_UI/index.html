<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datepicker UI</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="main">
        <div class="datepicker">
            <div class="datapicker__controls">
                
                <button class="datapicker__button"></button>
            </div>
            <div class="datapicker__calendar">

            </div>
        </div>
        <div class="datapicker">
            <div class="datapicker_controls">
                <input type="date" name="selected-date" id="datapicker-input" class="datapicker__input" />
            </div>
            <div class="calendar datapicker__calendar">
                <header class="calendar__heading">

                </header>
                <div class="calendar__weekdays">
                    
                </div>
            </div>
        </div>
    </div>
</body>
</html>
